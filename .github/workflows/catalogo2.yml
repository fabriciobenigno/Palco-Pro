name: Atualizar Catalogo 2

on:
  repository_dispatch:
    types: [novo-cadastro]

permissions:
  contents: write

jobs:
  atualizar-catalogo:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Atualizar catalogo2.json
        env:
          PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          python - <<'PY'
          import json
          import os

          arquivo = "catalogo2.json"

          with open(arquivo, "r", encoding="utf-8") as f:
              catalogo = json.load(f)

          dados = json.loads(os.environ["PAYLOAD"])

          catalogo.append(dados)

          with open(arquivo, "w", encoding="utf-8") as f:
              json.dump(
                  catalogo,
                  f,
                  ensure_ascii=False,
                  indent=2
              )
          PY

      - name: Fazer commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add catalogo2.json

          if git diff --cached --quiet; then
            echo "Nenhuma alteração para salvar."
            exit 0
          fi

          git commit -m "Adicionar cadastro ao catalogo2"
          git push
