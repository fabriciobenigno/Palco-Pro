  <style>
    :root{color-scheme:dark}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#090909;color:#f5f5f5;font-family:Arial,Helvetica,sans-serif}main{text-align:center;padding:32px}p{opacity:.75}a{color:#f3bb51}
  </style>
</head>
<body>
  <main>
    <div>🎮 Abrindo a partida…</div>
    <p>Você será direcionado para o Palco Pro.</p>
    <noscript><a id="fallback" href="./">Continuar para o jogo</a></noscript>
  </main>
  <script>
    (function(){
      const q=new URLSearchParams(location.search);
      const room=(q.get('room')||'').toUpperCase();
      const key=q.get('key')||'';
      const target=new URL('./', location.href);
      target.searchParams.set('jogo','velha');
      if(room) target.searchParams.set('room',room);
      if(key) target.searchParams.set('key',key);
      const fallback=document.getElementById('fallback');
      if(fallback) fallback.href=target.toString();
      location.replace(target.toString());
    })();
  </script>
</body>
