name: Publicar catálogo do Palco Pro

on:
  push:
    paths:
      - 'catalogo-fonte.json'
      - '.github/workflows/publicar-catalogo.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Validar catálogo
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('catalogo-fonte.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          songs = data.get('songs', data if isinstance(data, list) else None)
          if not isinstance(songs, list):
              raise SystemExit('catalogo-fonte.json não contém uma lista de músicas em "songs".')
          for i, song in enumerate(songs, start=1):
              if not isinstance(song, dict):
                  raise SystemExit(f'Música {i} inválida.')
              if not str(song.get('title', song.get('song_title', ''))).strip():
                  raise SystemExit(f'Música {i} sem título.')
              if not str(song.get('lyrics', '')).strip():
                  raise SystemExit(f'Música {i} sem letra.')
          print(f'Catálogo validado: {len(songs)} músicas.')
          PY

      - name: Gerar catalogo.json
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          source = json.loads(Path('catalogo-fonte.json').read_text(encoding='utf-8'))
          songs = source.get('songs', source if isinstance(source, list) else [])
          normalized = []
          for index, song in enumerate(songs, start=1):
              song_id = str(song.get('id', '')).strip() or f'song-{index}'
              normalized.append({
                  'id': song_id,
                  'title': str(song.get('title', song.get('song_title', ''))).strip(),
                  'artist': str(song.get('artist', '')).strip(),
                  'style': str(song.get('style', '')).strip(),
                  'lyrics': str(song.get('lyrics', '')).replace('\r\n', '\n').replace('\r', '\n').strip(),
                  'active': song.get('active', True) is not False,
              })
          payload = {
              'format': 'palco-pro-suggestions',
              'version': 1,
              'generatedAt': source.get('updatedAt'),
              'songs': normalized,
          }
          Path('catalogo.json').write_text(json.dumps(payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Publicar catalogo.json
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalogo.json
          if git diff --cached --quiet; then
            echo 'Nenhuma alteração no catálogo final.'
            exit 0
          fi
          git commit -m 'Atualiza catálogo do Palco Pro'
          git push
